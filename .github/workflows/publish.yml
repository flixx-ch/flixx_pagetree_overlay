# Publishes a new version to the TYPO3 Extension Repository (TER) when a version tag (e.g. 2.0.0) is pushed.
# Requires the repository secret TYPO3_API_TOKEN (TER access token with scope extension:write).
# The message of the annotated tag is used as upload comment in TER.
name: Publish to TER

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  publish:
    name: Publish new version to TER
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      TYPO3_API_TOKEN: ${{ secrets.TYPO3_API_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check tag
        run: |
          if ! [[ "${GITHUB_REF}" =~ ^refs/tags/[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
            echo "Tag ${GITHUB_REF} is not a version number like 1.2.3"
            exit 1
          fi

      - name: Get version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"

      - name: Get comment
        run: |
          # The shallow checkout stores the tag as lightweight tag, fetch the annotated tag to read its message
          git fetch --force origin "${GITHUB_REF}:${GITHUB_REF}"
          comment=$(git tag -l "${version}" --format='%(contents)')
          if [[ -z "${comment// }" ]]; then
            echo "comment=Released version ${version}" >> "$GITHUB_ENV"
          else
            {
              echo 'comment<<EOF'
              echo "$comment"
              echo EOF
            } >> "$GITHUB_ENV"
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, mbstring, json, zip, curl
          tools: composer:v2

      - name: Install tailor
        run: composer global require typo3/tailor:^2.1 --prefer-dist --no-progress

      - name: Publish to TER
        run: |
          "$(composer global config bin-dir --absolute --quiet)/tailor" ter:publish --comment "${comment}" "${version}"
